<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Camera HD v4.3</title>

<style>
* {
box-sizing: border-box;
user-select: none;
-webkit-user-select: none;
}

body {
margin: 0;
padding: 0;
background: #000;
color: white;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
height: 100vh;
display: flex;
flex-direction: column;
justify-content: space-between;
overflow: hidden;
}

/* نوار بالای دوربین */
header {
background: rgba(0, 0, 0, 0.8);
padding: 15px 20px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #222;
z-index: 10;
}

.title {
font-size: 16px;
font-weight: 600;
letter-spacing: 1px;
color: #00e676;
display: flex;
align-items: center;
gap: 8px;
}

.badge {
background: red;
color: white;
font-size: 10px;
padding: 2px 6px;
border-radius: 4px;
font-weight: bold;
animation: pulse 1.5s infinite;
}

@keyframes pulse {
0% { opacity: 1; }
50% { opacity: 0.4; }
100% { opacity: 1; }
}

/* کادر پیش‌نمایش دوربین */
#cameraBox {
position: relative;
width: 100%;
flex: 1;
display: flex;
align-items: center;
justify-content: center;
background: #111;
overflow: hidden;
}

/* ویدیو آینه‌ای برای سلفی طبیعی */
video {
width: 100%;
height: 100%;
object-fit: cover;
transform: scaleX(-1);
}

/* گرید خطوط راهنما دوربین */
.grid-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
border: 1px solid rgba(255, 255, 255, 0.1);
pointer-events: none;
display: grid;
grid-template-columns: 1fr 1fr 1fr;
grid-template-rows: 1fr 1fr 1fr;
}
.grid-box {
border: 0.5px solid rgba(255, 255, 255, 0.08);
}

#resultImg {
display: none;
width: 100%;
height: 100%;
object-fit: contain;
background: #000;
}

/* کنترل‌ها و دکمه‌های شاتر */
.controls {
background: #0d0d0d;
padding: 20px;
display: flex;
justify-content: space-around;
align-items: center;
border-top: 1px solid #222;
z-index: 10;
}

/* دکمه عکاسی (شاتر) */
#captureBtn {
width: 75px;
height: 75px;
border-radius: 50%;
background: transparent;
border: 4px solid #fff;
padding: 4px;
cursor: pointer;
outline: none;
transition: transform 0.1s;
}
#captureBtn:active {
transform: scale(0.9);
}
.shutter-inner {
width: 100%;
height: 100%;
background: #fff;
border-radius: 50%;
}

.btn-secondary {
background: #222;
color: white;
border: 1px solid #444;
padding: 10px 16px;
border-radius: 20px;
font-size: 14px;
cursor: pointer;
display: none;
}

#statusMessage {
position: absolute;
top: 15px;
background: rgba(0, 0, 0, 0.6);
padding: 6px 14px;
border-radius: 15px;
font-size: 12px;
color: #eee;
z-index: 6;
}
</style>
</head>

<body>

<header>
<div class="title">
<span>📸 Ultra HD Camera</span>
<span class="badge">PRO</span>
</div>
<div style="font-size: 12px; color: #888;">HDR OFF</div>
</header>

<div id="cameraBox">
<div id="statusMessage">برای شروع روی صفحه ضربه بزنید</div>

<video id="video" autoplay playsinline muted></video>

<!-- خطوط گرید عکاسی حرفه‌ای -->
<div class="grid-overlay">
<div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
<div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
<div class="grid-box"></div><div class="grid-box"></div><div class="grid-box"></div>
</div>

<img id="resultImg" alt="تصویر ثبت شده">
</div>

<canvas id="canvas" style="display:none"></canvas>

<div class="controls">
<button id="retryBtn" class="btn-secondary">🔄 عکس مجدد</button>

<button id="captureBtn" disabled>
<div class="shutter-inner"></div>
</button>

<a id="downloadBtn" class="btn-secondary" style="text-decoration: none;" download="HD_Photo.png">💾 ذخیره HD</a>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const captureBtn = document.getElementById("captureBtn");
const retryBtn = document.getElementById("retryBtn");
const downloadBtn = document.getElementById("downloadBtn");

const resultImg = document.getElementById("resultImg");
const cameraBox = document.getElementById("cameraBox");
const statusMessage = document.getElementById("statusMessage");

let stream = null;

// ۱. تصویر باکیفیت‌تر و طبیعی‌تر از میمون
const monkeyImg = new Image();
monkeyImg.crossOrigin = "anonymous";
// لینک جدید و دقیق‌تر برای قرارگیری کامل در کادر
monkeyImg.src = "https://png.pngtree.com/png-clipart/20221002/original/pngtree-cute-little-monkey-sitting-cartoon-png-image_8673455.png";

// درخواست مجوز و شروع دوربین
async function initCamera() {
try {
statusMessage.textContent = "در حال گرفتن دسترسی دوربین...";

stream = await navigator.mediaDevices.getUserMedia({
video: {
facingMode: "user",
width: { ideal: 1280 },
height: { ideal: 720 }
},
audio: false
});

video.srcObject = stream;
await video.play();

statusMessage.textContent = "آماده عکاسی (کیفیت HD)";
captureBtn.disabled = false;

} catch (err) {
console.error(err);
statusMessage.textContent = "❌ خطا در دسترسی! لطفاً مجوز دوربین را تأیید کنید.";
alert("لطفاً اجازه دسترسی به دوربین را در مرورگر صادر کنید.");
}
}

// عکاسی و اعمال سوپرایز میمون
captureBtn.onclick = function() {
if (!video.videoWidth) return;

const width = video.videoWidth;
const height = video.videoHeight;

canvas.width = width;
canvas.height = height;

// الف) رسم تصویر سلفی به صورت آینه‌ای
ctx.save();
ctx.translate(width, 0);
ctx.scale(-1, 1);
ctx.drawImage(video, 0, 0, width, height);
ctx.restore();

// ب) تنظیم اندازه و موقعیت جدید میمون (بزرگ‌تر و کاملاً داخل کادر)
const monkeyWidth = width * 0.45;  // افزایش اندازه عرض میمون
const monkeyHeight = width * 0.45; // متناسب کردن ارتفاع

// قرار دادن میمون در گوشه پایین سمت چپ، کاملاً داخل کادر و قابل رویت
const monkeyX = width * 0.02;
const monkeyY = height - monkeyHeight - (height * 0.05);

if (monkeyImg.complete && monkeyImg.naturalWidth !== 0) {
ctx.drawImage(monkeyImg, monkeyX, monkeyY, monkeyWidth, monkeyHeight);
} else {
ctx.font = (width * 0.25) + "px Arial";
ctx.fillText("🐒", monkeyX, height * 0.8);
}

// نمایش عکس نهایی
const dataURL = canvas.toDataURL("image/png");
resultImg.src = dataURL;

video.style.display = "none";
resultImg.style.display = "block";

// تغییر وضعیت دکمه‌ها
captureBtn.style.display = "none";
retryBtn.style.display = "inline-block";
downloadBtn.href = dataURL;
downloadBtn.style.display = "inline-block";

statusMessage.textContent = "😄 سوپرایز! عکس آماده شد.";
};

// عکس مجدد
retryBtn.onclick = function() {
resultImg.style.display = "none";
video.style.display = "block";

captureBtn.style.display = "inline-block";
retryBtn.style.display = "none";
downloadBtn.style.display = "none";

statusMessage.textContent = "آماده عکاسی (کیفیت HD)";
};

// راه‌اندازی با کلیک کاربر برای سازگاری با موبایل
window.addEventListener("click", () => {
if (!stream) {
initCamera();
}
}, { once: true });

window.addEventListener("load", () => {
initCamera();
});

window.addEventListener("beforeunload", () => {
if (stream) {
stream.getTracks().forEach(track => track.stop());
}
});
</script>

</body>
</html>
