<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b3f">
<title>اجرای نرم‌افزار SAHROUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#081725;color:#f3f8fb}
#bar{height:auto;min-height:58px;padding:9px 12px;display:flex;align-items:center;gap:10px;background:#102b3f;border-bottom:1px solid #34566b;position:relative;z-index:2;box-shadow:0 3px 14px #0004}
#back{border:0;border-radius:11px;padding:11px 14px;background:#55d6be;color:#092b32;font: bold 14px Tahoma;cursor:pointer;white-space:nowrap}
#caption{font-size:12px;color:#d3e6ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app{display:block;width:100%;height:calc(100dvh - 60px);border:0;background:white}
#problem{display:none;padding:18px;line-height:2;color:#f3f8fb}
</style>
</head>
<body>
<div id="bar"><button id="back" type="button">← بازگشت به درگاه یکپارچه</button><div id="caption">در حال باز کردن نرم‌افزار…</div></div>
<iframe id="app" title="نرم‌افزار انتخاب‌شده" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="problem">این نرم‌افزار اجازه نمایش داخل قاب را نمی‌دهد. با دکمه بازگشت به درگاه برگردید و در صورت نیاز نشانی آن را جداگانه باز کنید.</div>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const raw=params.get("url");
 const frame=document.getElementById("app");
 const back=document.getElementById("back");
 const caption=document.getElementById("caption");
 const problem=document.getElementById("problem");
 back.addEventListener("click",()=>{location.href=new URL("index.html",location.href).href;});
 try{
   const target=new URL(raw);
   if(target.protocol!=="https:" || target.hostname!=="sahroud.github.io") throw new Error("invalid target");
   caption.textContent=target.pathname.replace(/\/$/,"").split("/").filter(Boolean).pop() || "نرم‌افزار SAHROUD";
   frame.src=target.href;
   frame.addEventListener("error",()=>{problem.style.display="block";});
   setTimeout(()=>{try{if(!frame.contentDocument || !frame.contentDocument.body)problem.style.display="block";}catch(e){problem.style.display="block";}},7000);
 }catch(e){
   caption.textContent="نشانی نامعتبر";
   frame.style.display="none";
   problem.style.display="block";
 }
})();
</script>
</body>
</html>
