name: SAHROUD FAMILY GUARD APK

on:
  workflow_dispatch:
  push:
    paths:
      - "family-guard/android/**"
      - "family-guard/server/**"
      - ".github/workflows/family-guard-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: family-guard/android
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahroud-family-guard-debug-apk
          path: family-guard/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK to GitHub Releases
        if: github.ref == 'refs/heads/feat/family-guard-completion'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: family-guard-v0.2.1
          name: SAHROUD FAMILY GUARD v0.2.1 (Test)
          body: |
            نسخه آزمایشی اندروید SAHROUD FAMILY GUARD.
            برای نصب مستقیم، فایل app-debug.apk را دریافت کنید.
            توجه: API و پنل والد باید جداگانه روی Cloudflare راه‌اندازی شوند. این APK آزمایشی است.
          prerelease: true
          files: family-guard/android/app/build/outputs/apk/debug/app-debug.apk
