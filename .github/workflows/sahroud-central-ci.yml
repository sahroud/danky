name: SAHROUD CENTRAL CI

on:
  push:
    branches:
      - main
      - feat/sahroud-central-foundation
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install platform dependencies
        run: npm install --ignore-scripts
      - name: Run API and authentication tests
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate central D1 migration and constraints
        run: python test/schema.test.py
