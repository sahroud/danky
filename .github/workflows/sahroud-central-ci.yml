name: SAHROUD CENTRAL CI

on:
  push:
    branches:
      - main
      - feat/sahroud-central-foundation
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run API tests
        run: npm test
