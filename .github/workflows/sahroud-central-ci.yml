name: SAHROUD Central CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/sahroud-central-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
