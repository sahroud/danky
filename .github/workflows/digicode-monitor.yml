name: SAHROUD DIGI CODE treasure hunter
on:
  push:
    paths:
      - 'scripts/digicode_monitor.py'
      - '.github/workflows/digicode-monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: digicode-treasure-hunter
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan public pages and product images
        run: python scripts/digicode_monitor.py
      - name: Publish scan results
        run: |
          if ! git diff --quiet -- digicode/candidates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add digicode/candidates.json
            git commit -m "Update treasure hunt scan results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
