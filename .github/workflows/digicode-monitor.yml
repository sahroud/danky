name: SAHROUD DIGI CODE discount monitor
on:
  push:
    paths:
      - 'scripts/digicode_monitor.py'
      - 'digicode/index.html'
      - '.github/workflows/digicode-monitor.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: sahroud-digi-code-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python and browser JavaScript
        run: |
          python -m py_compile scripts/digicode_monitor.py
          python - <<'PY'
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script': self.active=True
              def handle_endtag(self, tag):
                  if tag == 'script': self.active=False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
          parser=Scripts()
          parser.feed(open('digicode/index.html',encoding='utf-8').read())
          assert parser.parts, 'No inline JavaScript found'
          open('/tmp/sahroud-digicode.js','w',encoding='utf-8').write('\n'.join(parser.parts))
          PY
          node --check /tmp/sahroud-digicode.js
      - name: Scan public pages and product images
        run: python scripts/digicode_monitor.py
      - name: Publish scan results
        run: |
          if ! git diff --quiet -- digicode/candidates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add digicode/candidates.json
            git commit -m "Update discount-code scan results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
